server {
    listen 80;
    server_name localhost;

    # Proxy to the Vite development server
    location / {
        proxy_pass http://frontend:5173; # 'frontend' is the service name, 5173 is Vite's port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        
        # Aggressive no-caching for development
        proxy_no_cache 1; # Do not cache the response from the proxy
        proxy_cache_bypass 1; # Always bypass the cache for requests to this location
        add_header Cache-Control 'no-cache, no-store, must-revalidate, proxy-revalidate'; # Tell clients (and Nginx itself) not to cache
        add_header Pragma 'no-cache'; # For older HTTP/1.0 clients
        expires -1; # Tell Nginx and clients that the content is immediately stale

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for API calls to the backend service
    location /api/ {
        proxy_pass http://backend:8000; # 'backend' will be the service name in compose.yaml
                                         # Port 8000 matches backend.Dockerfile EXPOSE
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Custom error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        # This path might need adjustment if 50x.html is not served by Vite
        # For dev, Vite's error overlays are usually sufficient.
        root   /usr/share/nginx/html;
    }
}
