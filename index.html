<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WYSIWYG Markdown Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            padding: 20px;
            margin: 0;
        }

        .editor-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .editor {
            min-height: 500px;
            padding: 40px;
            font-size: 16px;
            line-height: 1.7;
            outline: none;
            border: none;
            color: #2d3748;
            resize: none;
            font-family: inherit;
        }

        .editor:empty::before {
            content: "Write something...";
            color: #a0aec0;
            font-style: italic;
            pointer-events: none;
        }

        .editor:focus {
            outline: none;
        }

        .editor h1 {
            font-size: 2.25em;
            font-weight: 700;
            margin: 0.8em 0 0.4em 0;
            color: #1a202c;
            line-height: 1.2;
        }

        .editor h2 {
            font-size: 1.875em;
            font-weight: 600;
            margin: 0.7em 0 0.3em 0;
            color: #2d3748;
            line-height: 1.3;
        }

        .editor h3 {
            font-size: 1.5em;
            font-weight: 600;
            margin: 0.6em 0 0.3em 0;
            color: #2d3748;
            line-height: 1.4;
        }

        .editor p {
            margin: 0.6em 0;
            color: #4a5568;
        }

        .editor p:first-child {
            margin-top: 0;
        }

        .editor p:last-child {
            margin-bottom: 0;
        }

        .editor a {
            color: #3182ce;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .editor a:hover {
            color: #2c5282;
            border-bottom-color: #3182ce;
        }

        .editor strong {
            font-weight: 700;
            color: #2d3748;
        }

        .editor em {
            font-style: italic;
            color: #4a5568;
        }

        .editor ul, .editor ol {
            margin: 0.6em 0;
            padding-left: 1.5em;
        }

        .editor ul:first-child, .editor ol:first-child {
            margin-top: 0;
        }

        .editor ul:last-child, .editor ol:last-child {
            margin-bottom: 0;
        }

        .editor li {
            margin: 0.2em 0;
            color: #4a5568;
        }

        .editor ul {
            list-style-type: disc;
        }

        .editor ol {
            list-style-type: decimal;
        }

        /* Smooth transitions for formatting changes */
        .editor * {
            transition: all 0.1s ease;
        }

        /* Ensure proper line spacing */
        .editor div {
            margin: 0.6em 0;
        }

        .editor div:first-child {
            margin-top: 0;
        }

        .editor div:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <div class="editor" contenteditable="true" id="editor"></div>
    </div>

    <script>
        class MarkdownEditor {
            constructor(elementId) {
                this.editor = document.getElementById(elementId);
                this.isFormatting = false;
                this.init();
            }

            init() {
                // Ensure proper paragraph structure
                this.ensureParagraphStructure();
                
                // Use input event to detect when user finishes typing patterns
                this.editor.addEventListener('input', (e) => this.handleInput(e));
                this.editor.addEventListener('keydown', (e) => this.handleKeydown(e));
                this.editor.addEventListener('paste', (e) => this.handlePaste(e));
            }

            handleKeydown(e) {
                if (e.key === 'Backspace') {
                    this.handleBackspace(e);
                } else if (e.key === 'Enter') {
                    // Let the browser handle it, then clean up
                    setTimeout(() => this.ensureParagraphStructure(), 0);
                }
            }

            ensureParagraphStructure() {
                // If editor is empty, add a paragraph
                if (!this.editor.innerHTML.trim()) {
                    this.editor.innerHTML = '<div><br></div>';
                    return;
                }
                
                // Wrap any loose text nodes in divs
                const childNodes = Array.from(this.editor.childNodes);
                for (const node of childNodes) {
                    if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()) {
                        const div = document.createElement('div');
                        div.textContent = node.textContent;
                        this.editor.replaceChild(div, node);
                    }
                }
            }

            handleInput(e) {
                if (this.isFormatting) return;
                
                // Only format on space - when patterns are "complete"
                if (e.data === ' ') {
                    this.formatCurrentLine();
                } else if (e.inputType === 'insertText' && e.data === ')') {
                    // Check for link completion
                    this.formatLinks();
                }
            }

            formatCurrentLine() {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                
                const range = selection.getRangeAt(0);
                
                // Get the current block element (paragraph, div, etc.)
                let element = range.startContainer;
                if (element.nodeType === Node.TEXT_NODE) {
                    element = element.parentElement;
                }
                
                // Walk up to find the immediate child of the editor
                while (element.parentElement && element.parentElement !== this.editor) {
                    element = element.parentElement;
                }
                
                // Safety check: only format if this element contains no newlines
                const text = element.textContent || '';
                if (text.includes('\n')) {
                    return; // Don't format multi-line content
                }
                
                // Check for header patterns
                let level = 0;
                let headerText = '';
                
                if (text === '### ') {
                    level = 3;
                    headerText = '';
                } else if (text === '## ') {
                    level = 2;
                    headerText = '';
                } else if (text === '# ') {
                    level = 1;
                    headerText = '';
                } else if (text.match(/^### (.+)$/)) {
                    level = 3;
                    headerText = text.substring(4);
                } else if (text.match(/^## (.+)$/)) {
                    level = 2;
                    headerText = text.substring(3);
                } else if (text.match(/^# (.+)$/)) {
                    level = 1;
                    headerText = text.substring(2);
                }
                
                if (level > 0) {
                    this.convertToHeader(element, level, headerText);
                    return;
                }
                
                // Check for list patterns
                let listType = null;
                let listText = '';
                
                if (text === '- ' || text === '* ') {
                    listType = 'unordered';
                    listText = '';
                } else if (text.match(/^\d+\. $/)) {
                    listType = 'ordered';
                    listText = '';
                } else if (text.match(/^- (.+)$/)) {
                    listType = 'unordered';
                    listText = text.substring(2);
                } else if (text.match(/^\* (.+)$/)) {
                    listType = 'unordered';
                    listText = text.substring(2);
                } else if (text.match(/^\d+\. (.+)$/)) {
                    listType = 'ordered';
                    listText = text.replace(/^\d+\. /, '');
                }
                
                if (listType) {
                    this.convertToList(element, listType, listText);
                }
            }

            convertToHeader(element, level, content) {
                this.isFormatting = true;
                
                const selection = window.getSelection();
                const range = selection.getRangeAt(0);
                const cursorOffset = this.getCursorOffsetInElement(element, range);
                
                // Create new header element
                const headerTag = `h${level}`;
                const newHeader = document.createElement(headerTag);
                
                // Set content - if empty, add a zero-width space to maintain cursor position
                if (content.trim() === '') {
                    newHeader.innerHTML = '<br>'; // Use BR for empty headers
                } else {
                    newHeader.textContent = content;
                }
                
                // Replace the element
                element.parentNode.replaceChild(newHeader, element);
                
                // Restore cursor position
                if (content.trim() === '') {
                    // Position at the beginning of empty header
                    const range = document.createRange();
                    const selection = window.getSelection();
                    range.setStart(newHeader, 0);
                    range.collapse(true);
                    selection.removeAllRanges();
                    selection.addRange(range);
                } else {
                    // Position at the same relative location in the content
                    const adjustedOffset = Math.max(0, cursorOffset - (level + 1));
                    this.setCursorInElement(newHeader, adjustedOffset);
                }
                
                this.isFormatting = false;
            }

            convertToList(element, listType, content) {
                this.isFormatting = true;
                
                const selection = window.getSelection();
                const range = selection.getRangeAt(0);
                const cursorOffset = this.getCursorOffsetInElement(element, range);
                
                // Create list container and list item
                const listContainer = document.createElement(listType === 'ordered' ? 'ol' : 'ul');
                const listItem = document.createElement('li');
                
                // Set content - if empty, add a BR for cursor positioning
                if (content.trim() === '') {
                    listItem.innerHTML = '<br>';
                } else {
                    listItem.textContent = content;
                }
                
                listContainer.appendChild(listItem);
                
                // Replace the element
                element.parentNode.replaceChild(listContainer, element);
                
                // Restore cursor position
                if (content.trim() === '') {
                    // Position at the beginning of empty list item
                    const range = document.createRange();
                    const selection = window.getSelection();
                    range.setStart(listItem, 0);
                    range.collapse(true);
                    selection.removeAllRanges();
                    selection.addRange(range);
                } else {
                    // Position at the same relative location in the content
                    const prefixLength = listType === 'ordered' ? 3 : 2; // "1. " vs "- "
                    const adjustedOffset = Math.max(0, cursorOffset - prefixLength);
                    this.setCursorInElement(listItem, adjustedOffset);
                }
                
                this.isFormatting = false;
            }

            convertToList(element, listType, content) {
                this.isFormatting = true;
                
                const selection = window.getSelection();
                const range = selection.getRangeAt(0);
                const cursorOffset = this.getCursorOffsetInElement(element, range);
                
                // Create list container and list item
                const listContainer = document.createElement(listType === 'ordered' ? 'ol' : 'ul');
                const listItem = document.createElement('li');
                
                // Set content - if empty, add a BR for cursor positioning
                if (content.trim() === '') {
                    listItem.innerHTML = '<br>';
                } else {
                    listItem.textContent = content;
                }
                
                listContainer.appendChild(listItem);
                
                // Replace the element
                element.parentNode.replaceChild(listContainer, element);
                
                // Restore cursor position
                if (content.trim() === '') {
                    // Position at the beginning of empty list item
                    const range = document.createRange();
                    const selection = window.getSelection();
                    range.setStart(listItem, 0);
                    range.collapse(true);
                    selection.removeAllRanges();
                    selection.addRange(range);
                } else {
                    // Position at the same relative location in the content
                    const prefixLength = listType === 'ordered' ? 3 : 2; // "1. " vs "- "
                    const adjustedOffset = Math.max(0, cursorOffset - prefixLength);
                    this.setCursorInElement(listItem, adjustedOffset);
                }
                
                this.isFormatting = false;
            }
            
            formatLinks() {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                
                const range = selection.getRangeAt(0);
                const currentNode = range.startContainer;
                
                if (currentNode.nodeType === Node.TEXT_NODE) {
                    const text = currentNode.textContent;
                    const linkRegex = /\[([^\]]+)\]\(([^)]+)\)/g;
                    
                    if (linkRegex.test(text)) {
                        this.isFormatting = true;
                        
                        // Replace text with formatted version
                        const newHTML = text.replace(linkRegex, '<a href="$2">$1</a>');
                        const wrapper = document.createElement('div');
                        wrapper.innerHTML = newHTML;
                        
                        // Replace the text node with the new content
                        const parent = currentNode.parentElement;
                        while (wrapper.firstChild) {
                            parent.insertBefore(wrapper.firstChild, currentNode);
                        }
                        parent.removeChild(currentNode);
                        
                        // Position cursor after the link
                        const newRange = document.createRange();
                        const linkElement = parent.querySelector('a:last-child');
                        if (linkElement && linkElement.nextSibling) {
                            newRange.setStart(linkElement.nextSibling, 0);
                        } else {
                            newRange.setStartAfter(linkElement);
                        }
                        newRange.collapse(true);
                        selection.removeAllRanges();
                        selection.addRange(newRange);
                        
                        this.isFormatting = false;
                    }
                }
            }

            getCursorOffsetInElement(element, range) {
                const textBeforeCursor = range.cloneRange();
                textBeforeCursor.selectNodeContents(element);
                textBeforeCursor.setEnd(range.startContainer, range.startOffset);
                return textBeforeCursor.toString().length;
            }

            setCursorInElement(element, offset) {
                const range = document.createRange();
                const selection = window.getSelection();
                
                // If element contains a BR (empty header), position before it
                if (element.innerHTML === '<br>') {
                    range.setStart(element, 0);
                    range.collapse(true);
                    selection.removeAllRanges();
                    selection.addRange(range);
                    return;
                }
                
                // Find text nodes and position cursor
                const walker = document.createTreeWalker(
                    element,
                    NodeFilter.SHOW_TEXT,
                    null,
                    false
                );
                
                let currentOffset = 0;
                let textNode;
                
                while (textNode = walker.nextNode()) {
                    const nodeLength = textNode.textContent.length;
                    if (currentOffset + nodeLength >= offset) {
                        range.setStart(textNode, Math.min(offset - currentOffset, nodeLength));
                        range.collapse(true);
                        selection.removeAllRanges();
                        selection.addRange(range);
                        return;
                    }
                    currentOffset += nodeLength;
                }
                
                // Fallback: position at end of element
                if (textNode) {
                    range.setStart(textNode, textNode.textContent.length);
                } else {
                    range.setStart(element, element.childNodes.length);
                }
                range.collapse(true);
                selection.removeAllRanges();
                selection.addRange(range);
            }

            handleBackspace(e) {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                
                const range = selection.getRangeAt(0);
                
                if (range.collapsed && range.startOffset === 0) {
                    const element = range.startContainer.nodeType === Node.TEXT_NODE 
                        ? range.startContainer.parentElement 
                        : range.startContainer;
                    
                    // Check if we're at the beginning of a header
                    if (['H1', 'H2', 'H3'].includes(element.tagName)) {
                        e.preventDefault();
                        this.degradeHeader(element);
                        return;
                    }
                    
                    // Check if we're at the beginning of a list item
                    if (element.tagName === 'LI') {
                        e.preventDefault();
                        this.degradeListItem(element);
                        return;
                    }
                }

                // Check if we're at the end of a link
                const container = range.startContainer;
                const element = container.nodeType === Node.TEXT_NODE 
                    ? container.parentElement 
                    : container;
                
                if (element.tagName === 'A' && range.startOffset === container.textContent.length) {
                    e.preventDefault();
                    this.breakLink(element);
                }
            }

            degradeHeader(headerElement) {
                this.isFormatting = true;
                
                const text = headerElement.textContent;
                const level = parseInt(headerElement.tagName.substring(1));
                
                let newElement;
                
                if (level === 1) {
                    // H1 becomes regular paragraph - no markdown syntax shown
                    newElement = document.createElement('div');
                    newElement.textContent = text;
                } else {
                    // H2 becomes H1, H3 becomes H2 - no markdown syntax shown
                    newElement = document.createElement(`h${level - 1}`);
                    newElement.textContent = text;
                }
                
                headerElement.parentNode.replaceChild(newElement, headerElement);
                
                // Position cursor at start of the text
                this.setCursorInElement(newElement, 0);
                
                this.isFormatting = false;
            }

            degradeListItem(listItem) {
                this.isFormatting = true;
                
                const text = listItem.textContent;
                const listContainer = listItem.parentElement;
                
                // Create a regular div with the list item content
                const newDiv = document.createElement('div');
                newDiv.textContent = text;
                
                // Replace the entire list with the div
                listContainer.parentNode.replaceChild(newDiv, listContainer);
                
                // Position cursor at start of the text
                this.setCursorInElement(newDiv, 0);
                
                this.isFormatting = false;
            }

            breakLink(linkElement) {
                this.isFormatting = true;
                
                const text = linkElement.textContent;
                const href = linkElement.getAttribute('href') || '';
                const markdown = `[${text}](${href}`;
                
                // Create a text node with the markdown
                const textNode = document.createTextNode(markdown);
                
                // Replace the link with the text node
                linkElement.parentNode.replaceChild(textNode, linkElement);
                
                // Position cursor at the end
                const range = document.createRange();
                const selection = window.getSelection();
                range.setStart(textNode, markdown.length);
                range.collapse(true);
                selection.removeAllRanges();
                selection.addRange(range);
                
                this.isFormatting = false;
            }

            handlePaste(e) {
                e.preventDefault();
                const text = e.clipboardData.getData('text/plain');
                
                // Check if pasted content contains markdown
                if (this.containsMarkdown(text)) {
                    // Parse and render markdown content
                    this.parseAndRenderMarkdown(text);
                } else {
                    // Insert as plain text if no markdown detected
                    document.execCommand('insertText', false, text);
                }
                
                // Clean up structure after paste
                setTimeout(() => this.ensureParagraphStructure(), 0);
            }
            
            containsMarkdown(text) {
                // Check for common markdown patterns
                const patterns = [
                    /^#+\s+.+$/m,          // Headers
                    /^[\-\*]\s+.+$/m,      // Unordered lists
                    /^\d+\.\s+.+$/m,       // Ordered lists
                    /\[.+?\]\(.+?\)/,      // Links
                    /^\s*>\s+.+$/m,        // Blockquotes
                    /\*\*.+?\*\*/,          // Bold
                    /\*.+?\*/,              // Italic
                    /^\s*```[\s\S]*?```/m  // Code blocks
                ];
                
                return patterns.some(pattern => pattern.test(text));
            }
            
            parseAndRenderMarkdown(markdown) {
                // Split the markdown into lines
                const lines = markdown.split('\n');
                
                // Process each line or block
                let i = 0;
                while (i < lines.length) {
                    const line = lines[i].trim();
                    
                    // Process headers
                    if (/^#{1,3}\s+.+$/.test(line)) {
                        const level = (line.match(/^#+/)[0] || '').length;
                        const content = line.replace(/^#+\s+/, '');
                        
                        // Insert header element
                        const headerTag = `h${level}`;
                        const header = document.createElement(headerTag);
                        header.textContent = content;
                        this.insertNodeAtCursor(header);
                    }
                    // Process unordered lists
                    else if (/^[\-\*]\s+.+$/.test(line)) {
                        // Find consecutive list items
                        const listItems = [];
                        while (i < lines.length && /^[\-\*]\s+.+$/.test(lines[i].trim())) {
                            listItems.push(lines[i].trim().replace(/^[\-\*]\s+/, ''));
                            i++;
                        }
                        i--; // Adjust for the outer loop increment
                        
                        // Create and insert list
                        const ul = document.createElement('ul');
                        listItems.forEach(item => {
                            const li = document.createElement('li');
                            li.textContent = item;
                            ul.appendChild(li);
                        });
                        this.insertNodeAtCursor(ul);
                    }
                    // Process ordered lists
                    else if (/^\d+\.\s+.+$/.test(line)) {
                        // Find consecutive list items
                        const listItems = [];
                        while (i < lines.length && /^\d+\.\s+.+$/.test(lines[i].trim())) {
                            listItems.push(lines[i].trim().replace(/^\d+\.\s+/, ''));
                            i++;
                        }
                        i--; // Adjust for the outer loop increment
                        
                        // Create and insert list
                        const ol = document.createElement('ol');
                        listItems.forEach(item => {
                            const li = document.createElement('li');
                            li.textContent = item;
                            ol.appendChild(li);
                        });
                        this.insertNodeAtCursor(ol);
                    }
                    // Process paragraphs (default)
                    else {
                        // Skip empty lines
                        if (line !== '') {
                            // Process inline formatting (links, bold, italic)
                            let content = line;
                            
                            // Format links [text](url)
                            content = content.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>');
                            
                            // Format bold **text**
                            content = content.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                            
                            // Format italic *text*
                            content = content.replace(/\*(.+?)\*/g, '<em>$1</em>');
                            
                            // Create paragraph with formatted content
                            const p = document.createElement('p');
                            p.innerHTML = content;
                            this.insertNodeAtCursor(p);
                        }
                    }
                    
                    i++;
                }
            }
            
            insertNodeAtCursor(node) {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                
                const range = selection.getRangeAt(0);
                range.deleteContents();
                
                // Insert the new node
                range.insertNode(node);
                
                // Move cursor to the end of the inserted content
                range.setStartAfter(node);
                range.collapse(true);
                selection.removeAllRanges();
                selection.addRange(range);
                
                // Insert a paragraph after the node if it's not already followed by one
                const nextElement = node.nextElementSibling;
                if (!nextElement || !['P', 'H1', 'H2', 'H3', 'UL', 'OL'].includes(nextElement.tagName)) {
                    const p = document.createElement('p');
                    p.innerHTML = '<br>';
                    node.parentNode.insertBefore(p, node.nextSibling);
                }
            }
        }

        // Initialize the editor when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new MarkdownEditor('editor');
        });
    </script>
</body>
</html>
