<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor Crepe</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
  <div id="main-container">
    <div id="tree-drawer" data-id="tree">
  <!-- Directory tree will be rendered here -->
  <div class="drawer-border">
    <button class="drawer-toggle" id="drawer-toggle" aria-label="Toggle tree drawer" tabindex="0">
      <span class="drawer-chevron">⏴</span>
    </button>
  </div>
  <div class="drawer-resizer" aria-hidden="true"></div>
</div>
    <div id="content">
      <div id="editor-status-bar" class="editor-status-bar" role="toolbar">
        <div class="flex-spacer"></div>
        <div class="status-right">
          <div class="status-meta">
            <span class="commit-meta draft-text hidden" data-id="commit-meta"></span>
            <a href="#" class="history-link" data-id="history-btn">history</a>
          </div>
          <div class="status-actions">
            <span class="draft-text hidden" data-id="draft-text">Draft</span>
            <button class="save-btn" data-id="save-btn" aria-label="Save changes">Save</button>
            <button class="discard-btn" data-id="discard-btn" aria-label="Discard changes">Discard</button>
          </div>
        </div>
        <div class="mode-control" data-id="mode-control">
          <button class="mode-btn selected" data-mode="read" aria-label="Read mode">👁</button>
          <button class="mode-btn" data-mode="wysiwyg" aria-label="WYSIWYG mode">✏️</button>
          <button class="mode-btn" data-mode="raw" aria-label="Raw markdown mode">md</button>
        </div>
      </div>
      <div id="editor-root"></div>
    </div>
    
    <!-- History Drawer -->
    <div id="history-drawer" class="history-drawer hidden" data-id="history-drawer">
      <div class="drawer-header">
        <h3>History</h3>
        <button class="drawer-close" data-id="history-close" aria-label="Close history">&times;</button>
      </div>
      <div class="drawer-content">
        <div class="history-list" data-id="history-list">
          <!-- Commit history will be rendered here -->
        </div>
        <div class="diff-view hidden" data-id="diff-view">
          <div class="diff-header">
            <button class="back-btn" data-id="diff-back" aria-label="Back to history">&larr; Back</button>
            <div class="diff-title" data-id="diff-title">Commit Diff</div>
          </div>
          <div class="diff-content" data-id="diff-content">
            <!-- Diff content will be rendered here -->
          </div>
        </div>
      </div>
    </div>
    
  <dialog id="discard-dialog" class="confirm-dialog" data-id="discard-dialog">
    <form method="dialog" class="confirm-dialog-form">
      <p>Discard local changes?</p>
      <div class="confirm-actions">
        <button value="cancel" data-id="discard-cancel" class="btn-secondary">Cancel</button>
        <button value="confirm" data-id="discard-confirm" class="btn-danger">Discard</button>
      </div>
    </form>
  </dialog>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
