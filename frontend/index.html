<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor Crepe</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
  <div id="main-container">
    <div id="tree-drawer" data-id="tree">
  <!-- Directory tree will be rendered here -->
  <div class="drawer-border">
    <button class="drawer-toggle" id="drawer-toggle" aria-label="Toggle tree drawer" tabindex="0">
      <span class="drawer-chevron">⏴</span>
    </button>
  </div>
  <div class="drawer-resizer" aria-hidden="true"></div>
</div>
    <div id="content">
      <div id="editor-status-bar" class="editor-status-bar" role="toolbar">
        <div class="flex-spacer"></div>
        <div class="status-right">
          <div class="status-meta" data-id="commit-meta">
            <span class="commit-text" data-id="commit-text"></span>
            <div class="overflow-menu" data-id="overflow-menu">
              <button class="overflow-menu-btn" data-id="overflow-btn" aria-label="File actions">
                <span class="hamburger-dots">
                  <span class="dot"></span>
                  <span class="dot"></span>
                  <span class="dot"></span>
                </span>
              </button>
              <div class="overflow-menu-dropdown hidden" data-id="overflow-dropdown">
                <button class="overflow-menu-item" data-id="history-btn">View History</button>
                <button class="overflow-menu-item delete-item" data-id="delete-btn">Delete File</button>
              </div>
            </div>
          </div>
          <div class="status-actions">
            <span class="draft-text hidden" data-id="draft-text">Draft</span>
            <button class="save-btn hidden" data-id="save-btn" aria-label="Save changes">Save</button>
            <button class="discard-btn hidden" data-id="discard-btn" aria-label="Discard changes">Discard</button>
          </div>
        </div>
        <div class="mode-control" data-id="mode-control">
          <button class="mode-btn selected" data-mode="read" aria-label="Read mode">👁</button>
          <button class="mode-btn" data-mode="wysiwyg" aria-label="WYSIWYG mode">✏️</button>
          <button class="mode-btn" data-mode="raw" aria-label="Raw markdown mode">md</button>
        </div>
      </div>
      <div id="editor-root"></div>
    </div>
    
    <!-- History Drawer -->
    <div id="history-drawer" class="history-drawer hidden" data-id="history-drawer">
      <div class="drawer-header">
        <h3>History</h3>
        <button class="drawer-close" data-id="history-close" aria-label="Close history">&times;</button>
      </div>
      <div class="drawer-content">
        <div class="history-list" data-id="history-list">
          <!-- Commit history will be rendered here -->
        </div>
        <div class="diff-view hidden" data-id="diff-view">
          <div class="diff-header">
            <button class="back-btn" data-id="diff-back" aria-label="Back to history">&larr; Back</button>
            <div class="diff-title" data-id="diff-title">Commit Diff</div>
          </div>
          <div class="diff-content" data-id="diff-content">
            <!-- Diff content will be rendered here -->
          </div>
        </div>
      </div>
    </div>
    
  <dialog id="discard-dialog" class="confirm-dialog" data-id="discard-dialog">
    <form method="dialog" class="confirm-dialog-form">
      <p>Discard local changes?</p>
      <div class="confirm-actions">
        <button value="cancel" data-id="discard-cancel" class="btn-secondary">Cancel</button>
        <button value="confirm" data-id="discard-confirm" class="btn-danger">Discard</button>
      </div>
    </form>
  </dialog>
  
  <dialog id="delete-dialog" class="confirm-dialog" data-id="delete-dialog">
    <form method="dialog" class="confirm-dialog-form">
      <p>Are you sure you want to delete this file?</p>
      <p class="delete-file-path" data-id="delete-file-path"></p>
      <div class="confirm-actions">
        <button value="cancel" data-id="delete-cancel" class="btn-secondary">Cancel</button>
        <button value="confirm" data-id="delete-confirm" class="btn-danger">Delete</button>
      </div>
    </form>
  </dialog>
  
  <dialog id="delete-directory-dialog" class="confirm-dialog" data-id="delete-directory-dialog">
    <form method="dialog" class="confirm-dialog-form">
      <p>Are you sure you want to delete this empty directory?</p>
      <p class="delete-directory-path" data-id="delete-directory-path"></p>
      <input type="hidden" data-id="delete-directory-real-path" />
      <div class="confirm-actions">
        <button value="cancel" data-id="delete-directory-cancel" class="btn-secondary">Cancel</button>
        <button value="confirm" data-id="delete-directory-confirm" class="btn-danger">Delete Directory</button>
      </div>
    </form>
  </dialog>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
