# compose.override.yaml
# This file is automatically loaded by Docker Compose and overrides/extends compose.yaml
# Used for local development with HMR (Hot Module Reloading)

services:
  backend:
    volumes:
      # Mount backend source for live code reloading in development
      - ./backend:/app
    environment:
      # Tell FastAPI to proxy frontend requests to Vite dev server
      - VITE_DEV_SERVER=http://frontend:5173
    depends_on:
      - frontend

  # Frontend development server with HMR
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "5173:5173"  # Expose Vite dev server (optional, for direct access)
    volumes:
      - ./frontend:/app  # Mount source for HMR
      - frontend_node_modules:/app/node_modules  # Persist node_modules
    environment:
      - NODE_ENV=development

volumes:
  frontend_node_modules:
