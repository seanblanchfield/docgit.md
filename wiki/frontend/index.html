<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor Crepe</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
  <div id="main-container">
    <div id="tree-drawer" data-id="tree">
      <button class="drawer-toggle" id="drawer-toggle" aria-label="Toggle tree drawer" tabindex="0">
        <!-- Left chevron for open (expanded) -->
        <svg class="drawer-chevron" viewBox="0 0 24 24" aria-hidden="true" role="img"><path d="M8 4l8 8-8 8"/></svg>
      </button>
      <!-- Directory tree will be rendered here -->
    </div>
    <div id="content">
      <!-- Milkdown editor will be rendered here -->
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
